.wm{font-family:OGW,Poppins,-apple-system,sans-serif;font-weight:700;direction:ltr;unicode-bidi:isolate;letter-spacing:.5px}.wm b{color:var(--ac);font-weight:700}
:root{--bg:#0b0b0d;--card:#151519;--card2:#1d1d23;--line:#2a2a32;--tx:#f3f2ef;--mu:#8e8d96;--ac:#2f7bff;--ac2:#8ab4ff;--ok:#36c98a;--bad:#ff5b5b;--warn:#ffb340;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.num{font-variant-numeric:tabular-nums}.en{direction:ltr;unicode-bidi:isolate}
.mu{color:var(--mu)}.sm{font-size:13px}.b{font-weight:700}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* شاشة الدخول */
#auth{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 30px) 24px calc(var(--sb) + 30px);gap:12px;background:radial-gradient(120% 80% at 50% 0%,#14213d 0%,var(--bg) 60%)}
#auth .logo{width:84px;height:84px;border-radius:22px;align-self:center;margin-bottom:6px}
#auth h1{margin:0;text-align:center;font-size:28px;letter-spacing:1px}#auth p{margin:0 0 8px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;font-weight:700;border-radius:14px;padding:14px 18px;font-size:17px}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:rgba(255,91,91,.14);color:var(--bad)}.btn:disabled{opacity:.5}
#amsg{color:var(--bad);text-align:center;min-height:22px;font-size:14px}
/* الهيكل */
#app{display:none;height:100%;flex-direction:column}
header{padding:calc(var(--st) + 10px) 18px 8px;display:flex;align-items:flex-end;gap:10px;background:linear-gradient(var(--bg) 70%,rgba(11,11,13,0));position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:30px;font-weight:800;flex:1;line-height:1.2}
#sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 10px;margin-bottom:6px;white-space:nowrap}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}#sync.off i{background:var(--warn)}#sync.up i{background:var(--ac);animation:pu 1s infinite}#sync.err i{background:var(--bad)}
@keyframes pu{50%{opacity:.3}}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sb) + 96px)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(21,21,25,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(var(--sb) + 4px);z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 0}
nav button.on{color:var(--ac)}
#fab{position:fixed;left:18px;bottom:calc(var(--sb) + 76px);width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(47,123,255,.45);z-index:11}
#fab svg{width:28px;height:28px}
/* مكونات */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;font-weight:800;font-size:17px}
.ttl button{color:var(--ac);font-weight:600;font-size:15px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}

  $('shB').insertAdjacentHTML('afterbegin', '<div class="card" style="padding:12px 14px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><b>الفلوس اللي استلمناها</b><b class="num" style="color:var(--ok)">' + money(got) + '</b></div>' +
    (P.length ? P.map(x => '<div class="pyr"><span class="chk' + (x.data.done ? ' on' : '') + '"></span><div style="flex:1;min-width:0"><b class="num">' + money(x.data.a) + '</b><div class="mu sm">' + (x.data.done ? 'اتحصلت ' + dshort(x.data.doneAt || x.data.due) : 'لسه — ميعادها ' + dshort(x.data.due)) + (x.data.note ? ' · ' + esc(x.data.note) : '') + '</div></div>' + (ed ? '<button class="btn g" style="padding:7px 12px;font-size:14px" onclick="payFix(\'' + x.id + '\')">' + ico('gear', 15) + ' تعديل</button>' : '') + '</div>').join('') : '<div class="mu sm">لسه مفيش دفعات</div>') +
    (canAdd('pays') ? '<button class="btn g" style="width:100%;margin-top:8px;padding:10px" onclick="addLinked(\'pays\',\'' + id + '\')">' + ico('plus', 16) + ' دفعة جديدة</button>' : '') + '</div>');
};
function payFix(pid) {
  const x = ROWS.get(pid); if (!x) return; const d = x.data;
  sheet('تعديل دفعة', '<div class="fld"><label>المبلغ اللي استلمناه</label><input id="pf_a" type="number" inputmode="decimal" value="' + esc(d.a) + '"></div>' +
    '<div class="fld"><label>نوع الدفعة</label><div class="chips" id="pf_k">' + ['قسط', 'مقدم', 'مؤخر'].map(k => '<button class="' + (payKind(d) === k ? 'on' : '') + '" onclick="pick(this)">' + k + '</button>').join('') + '</div></div>' +
    '<div class="tog" onclick="this.querySelector(\'.sw\').classList.toggle(\'on\')"><span>اتحصلت</span><span class="sw' + (d.done ? ' on' : '') + '" id="pf_d"></span></div>' +
    '<div class="fld" style="margin-top:12px"><label>اتحصلت يوم</label><input id="pf_at" type="date" value="' + esc(String(d.doneAt || today()).slice(0, 10)) + '"></div>' +
    '<div class="fld"><label>ملاحظة</label><input id="pf_n" value="' + esc(d.note || '') + '"></div>' +
    '<button class="btn r" style="width:100%" onclick="askDel(\'' + pid + '\')">' + ico('trash', 18) + ' امسح الدفعة دي</button>', 'حفظ', () => {
    const n = clone(d), v = $('pf_a').value.trim(); if (v === '' || isNaN(+v)) return toast('اكتب المبلغ'); n.a = +v; n.done = $('pf_d').classList.contains('on'); n.note = $('pf_n').value.trim(); n.k = $('pf_k').querySelector('.on').textContent;
    if (n.done) n.doneAt = $('pf_at').value || today(); else delete n.doneAt;
    saveRec('pays', pid, n); toast('الدفعة اتعدلت ✓'); openRec(d.c); render();
  });
}

</script>
