.wm{font-family:OGW,Poppins,-apple-system,sans-serif;font-weight:700;direction:ltr;unicode-bidi:isolate;letter-spacing:.5px}.wm b{color:var(--ac);font-weight:700}
:root{--bg:#0b0b0d;--card:#151519;--card2:#1d1d23;--line:#2a2a32;--tx:#f3f2ef;--mu:#8e8d96;--ac:#2f7bff;--ac2:#8ab4ff;--ok:#36c98a;--bad:#ff5b5b;--warn:#ffb340;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.num{font-variant-numeric:tabular-nums}.en{direction:ltr;unicode-bidi:isolate}
.mu{color:var(--mu)}.sm{font-size:13px}.b{font-weight:700}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* شاشة الدخول */
#auth{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 30px) 24px calc(var(--sb) + 30px);gap:12px;background:radial-gradient(120% 80% at 50% 0%,#14213d 0%,var(--bg) 60%)}
#auth .logo{width:84px;height:84px;border-radius:22px;align-self:center;margin-bottom:6px}
#auth h1{margin:0;text-align:center;font-size:28px;letter-spacing:1px}#auth p{margin:0 0 8px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;font-weight:700;border-radius:14px;padding:14px 18px;font-size:17px}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:rgba(255,91,91,.14);color:var(--bad)}.btn:disabled{opacity:.5}
#amsg{color:var(--bad);text-align:center;min-height:22px;font-size:14px}
/* الهيكل */
#app{display:none;height:100%;flex-direction:column}
header{padding:calc(var(--st) + 10px) 18px 8px;display:flex;align-items:flex-end;gap:10px;background:linear-gradient(var(--bg) 70%,rgba(11,11,13,0));position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:30px;font-weight:800;flex:1;line-height:1.2}
#sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 10px;margin-bottom:6px;white-space:nowrap}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}#sync.off i{background:var(--warn)}#sync.up i{background:var(--ac);animation:pu 1s infinite}#sync.err i{background:var(--bad)}
@keyframes pu{50%{opacity:.3}}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sb) + 96px)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(21,21,25,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(var(--sb) + 4px);z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 0}
nav button.on{color:var(--ac)}
#fab{position:fixed;left:18px;bottom:calc(var(--sb) + 76px);width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(47,123,255,.45);z-index:11}
#fab svg{width:28px;height:28px}
/* مكونات */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;font-weight:800;font-size:17px}
.ttl button{color:var(--ac);font-weight:600;font-size:15px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}

    if (f.t === 'check') { const on = e.classList.contains('on'); if (on && !d[f.k]) d[f.k + 'At'] = today(); if (!on) delete d[f.k + 'At']; d[f.k] = on; }
    else if (f.t === 'select') d[f.k] = e.dataset.v || '';
    else if (f.t === 'money' || f.t === 'number' || f.t === 'percent') { const v = e.value.trim(); d[f.k] = v === '' ? '' : +v; }
    else d[f.k] = e.value.trim();
  });
  const tf = titleF(s); if (tf && !d[tf.k]) return toast('اكتب ' + tf.l);
  saveRec(k, id || nid(), d); closeSheet(); render(); toast(id ? 'اتعدل ✓' : 'اتضاف ✓');
}
function askDel(id) {
  sheet('تمسح دي؟', '<p class="mu">هتتمسح من كل الأجهزة.</p><button class="btn r" style="width:100%" onclick="delRec(\'' + id + '\');closeSheet();render();toast(\'اتمسح\')">أيوه امسح</button>', 'رجوع', () => { const r = ROWS.get(id); r ? openRec(id) : closeSheet(); });
}
function openRec(id) {
  const r = ROWS.get(id); if (!r) return; const s = SEC(r.coll); if (!s) return; const d = r.data;
  let h = '<div class="card" style="padding:4px 16px">' + s.fields.filter(f => !f.off && d[f.k] != null && d[f.k] !== '').map(f => '<div class="kv"><span>' + esc(f.l) + '</span><b' + (f.t === 'phone' ? ' class="en"' : '') + '>' + (f.t === 'phone' ? '<a href="tel:' + esc(d[f.k]) + '" style="color:var(--ac2)">' + esc(d[f.k]) + '</a>' : esc(showVal(f, d[f.k]))) + '</b></div>').join('') + '</div>';
  const a = acct(s, r);
  if (a && linked(s, r).some(x => x.s.flow === 'in')) h += '<div class="big"><div class="k"><div class="l">المتفق عليه' + (a.pct ? ' بعد خصم ' + fm(a.pct) + '%' : '') + '</div><div class="v num" style="font-size:20px">' + money(a.total) + '</div></div><div class="k"><div class="l">اتدفع</div><div class="v num ok" style="font-size:20px">' + money(a.paid) + '</div></div>' + (a.left ? '<div class="k w" style="background:var(--card);border-color:var(--line)"><div class="l">الباقي</div><div class="v num" style="font-size:22px;color:var(--warn)">' + money(a.left) + '</div></div>' : '') + '</div>';
  if (s.goal) { const need = +d[s.goal.field] || 0, got = recs(s.goal.from).filter(x => Object.values(x.data).indexOf(r.id) >= 0).length; if (need) h += '<div class="card"><div class="row" style="justify-content:space-between"><span>' + esc(s.goal.label) + '</span><b class="num">' + got + ' من ' + need + '</b></div><div class="prog"><i style="width:' + Math.min(100, got / need * 100) + '%"></i></div></div>'; }
  if (s.sub) { const e = subEnd(s, r); if (e) h += '<div class="card row" style="justify-content:space-between"><span>الاشتراك بيخلص ' + dshort(e) + '</span><button class="btn g" style="padding:8px 14px;font-size:15px" onclick="renew(\'' + id + '\')">تجديد</button></div>'; }
  linked(s, r).forEach(x => { if (!x.rs.length && x.s.hidden) return; h += '<div class="ttl">' + esc(x.s.n) + ' <button onclick="addLinked(\'' + x.s.k + '\',\'' + id + '\')">+ إضافة</button></div>' + (x.rs.length ? '<div class="list">' + x.rs.sort((p, q) => recDate(x.s, q) < recDate(x.s, p) ? -1 : 1).slice(0, 30).map(y => itemHtml(x.s, y)).join('') + '</div>' : '<div class="card empty" style="padding:14px">مفيش</div>'); });
  h += '<p class="mu sm" style="text-align:center;margin-top:14px">' + (r.by ? 'ضافه ' + esc(r.by) : '') + (r.at ? ' · ' + dshort(r.at) : '') + (r.ub && r.ub !== r.by ? ' · آخر تعديل ' + esc(r.ub) : '') + '</p>';
  sheet(recTitle(s, r), h, 'تعديل', () => editRec(r.coll, id));
}
function addLinked(k, pid) { const s = SEC(k), f = s.fields.find(x => x.t === 'link' && SEC(x.to) && ROWS.get(pid) && ROWS.get(pid).coll === x.to); editRec(k); setTimeout(() => { const e = f && $('f_' + f.k); if (e) e.value = pid; }, 30); }
function renew(id) {
  const r = ROWS.get(id), s = SEC(r.coll), e = subEnd(s, r), d = clone(r.data); d[s.sub.start] = e; d.cyc = (+d.cyc || 0) + 1; saveRec(r.coll, id, d);
  const a = acct(s, r), ps = CFG().sections.find(x => x.flow === 'in' && x.fields.some(f => f.t === 'link' && f.to === s.k) && fOf(x, 'check'));
  if (ps && a) { const lf = ps.fields.find(f => f.t === 'link' && f.to === s.k), mf = fOf(ps, 'money'), df = fOf(ps, 'date'), nf = ps.fields.find(f => f.t === 'text'), pd = {}; pd[lf.k] = id; pd[mf.k] = (+r.data[fOf(s, 'money').k] || 0) * (1 - a.pct / 100); if (df) pd[df.k] = e; if (nf) pd[nf.k] = 'تجديد الاشتراك'; pd[fOf(ps, 'check').k] = false; saveRec(ps.k, nid(), pd); }
  toast('الاشتراك اتجدد ✓'); openRec(id);
}

/* ---------- المزيد ---------- */

function myAcc() {
  sheet('حسابي', '<div class="fld"><label>كلمة سر جديدة</label><input id="np" type="password" autocomplete="new-password"></div><button class="btn" style="width:100%;margin-bottom:10px" onclick="chPass()">غيّر كلمة السر</button>' +

}
async function chPass() { const p = $('np').value; if (p.length < 6) return toast('كلمة السر 6 حروف على الأقل'); try { await api('/auth/v1/user', { method: 'PUT', body: { password: p } }); toast('كلمة السر اتغيرت ✓'); closeSheet(); } catch (e) { toast(errAr(e)); } }

  try { localStorage.removeItem('og-session'); localStorage.removeItem('og-auth'); } catch (e) { /* */ }
  Promise.all([IDB.clear('rows'), IDB.clear('kv'), IDB.clear('out')]).then(() => location.reload());

/* ---------- شكل السيستم (للمدير) ---------- */
let CE = null;
function cfgEdit() {
  CE = clone(CFG());
  sheet('شكل السيستم', cfgList(), 'حفظ', cfgSave);
}
function cfgList() {
  return '<p class="mu sm">الأقسام اللي بتظهر. الدبوس = يظهر في الشريط اللي تحت (أول 3). شيل القسم يخفيه بس والبيانات بتفضل.</p><div class="list">' + CE.sections.map((s, i) =>
    '<div class="it" style="opacity:' + (s.hidden ? .45 : 1) + '"><div class="ic">' + ico(s.i) + '</div><div class="tx" onclick="secEdit(' + i + ')"><div class="t1">' + esc(s.n) + '</div><div class="t2">' + s.fields.filter(f => !f.off).length + ' خانة' + (s.flow ? ' · ' + (s.flow === 'in' ? 'فلوس داخلة' : 'فلوس طالعة') : '') + '</div></div>' +
    '<button class="pill' + (s.tab ? ' g' : '') + '" onclick="CE.sections[' + i + '].tab=!CE.sections[' + i + '].tab;$(\'shB\').innerHTML=cfgList()">دبوس</button>' +
    '<button onclick="mvSec(' + i + ',-1)">' + ico('up', 18) + '</button><button onclick="CE.sections[' + i + '].hidden=!CE.sections[' + i + '].hidden;$(\'shB\').innerHTML=cfgList()">' + ico(s.hidden ? 'plus' : 'x', 18) + '</button></div>').join('') + '</div>' +
    '<button class="btn g" style="width:100%" onclick="newSec()">' + ico('plus', 18) + ' قسم جديد</button>';
}
function mvSec(i, d) { const j = i + d; if (j < 0 || j >= CE.sections.length) return; const a = CE.sections; [a[i], a[j]] = [a[j], a[i]]; $('shB').innerHTML = cfgList(); }
function newSec() { CE.sections.push({ k: 's' + nid().slice(-6), n: 'قسم جديد', i: 'box', fields: [F('n', 'الاسم', 'text'), F('a', 'المبلغ', 'money'), F('dt', 'التاريخ', 'date')] }); secEdit(CE.sections.length - 1); }
let SE = -1;
function secEdit(i) {
  SE = i; const s = CE.sections[i];
  sheet(s.n, '<div class="fld"><label>اسم القسم</label><input id="se_n" value="' + esc(s.n) + '" oninput="CE.sections[SE].n=this.value"></div>' +
    '<div class="fld"><label>الأيقونة</label><div class="chips">' + ICONS.map(k => '<button class="' + (s.i === k ? 'on' : '') + '" onclick="CE.sections[SE].i=\'' + k + '\';secEdit(SE)">' + ico(k, 18) + '</button>').join('') + '</div></div>' +
    '<div class="fld"><label>الفلوس اللي فيه</label><div class="chips">' + [['', 'مش فلوس'], ['in', 'فلوس داخلة'], ['out', 'فلوس طالعة']].map(x => '<button class="' + ((s.flow || '') === x[0] ? 'on' : '') + '" onclick="CE.sections[SE].flow=\'' + x[0] + '\';secEdit(SE)">' + x[1] + '</button>').join('') + '</div></div>' +
    '<div class="fld"><label>الخانات</label>' + s.fields.map((f, j) => f.off ? '' : '<div class="fe"><input value="' + esc(f.l) + '" oninput="CE.sections[SE].fields[' + j + '].l=this.value"><select onchange="setType(' + j + ',this.value)">' + Object.entries(TYPES).map(([k, v]) => '<option value="' + k + '"' + (f.t === k ? ' selected' : '') + '>' + v + '</option>').join('') + '</select><button onclick="mvF(' + j + ')">' + ico('up', 16) + '</button><button onclick="CE.sections[SE].fields[' + j + '].off=true;secEdit(SE)">' + ico('x', 16) + '</button></div>' +
      (f.t === 'select' ? '<input style="margin:-2px 0 10px;padding:9px 12px" placeholder="الاختيارات — افصل بينها بـ ،" value="' + esc((f.o || []).join('، ')) + '" oninput="CE.sections[SE].fields[' + j + '].o=this.value.split(/[،,]/).map(x=>x.trim()).filter(Boolean)">' : '') +
      (f.t === 'link' ? '<select style="margin:-2px 0 10px;padding:9px 12px" onchange="CE.sections[SE].fields[' + j + '].to=this.value">' + CE.sections.filter((x, q) => q !== SE).map(x => '<option value="' + x.k + '"' + (f.to === x.k ? ' selected' : '') + '>من ' + esc(x.n) + '</option>').join('') + '</select>' : '')).join('') +
    '<button class="btn g" style="width:100%;padding:10px" onclick="CE.sections[SE].fields.push(F(\'f\'+nid().slice(-5),\'خانة جديدة\',\'text\'));secEdit(SE)">' + ico('plus', 18) + ' خانة جديدة</button></div>' +
    (s.fields.some(f => f.off) ? '<p class="mu sm">خانات متشالة (البيانات بتاعتها محفوظة): ' + s.fields.filter(f => f.off).map((f, q) => '<button class="pill" onclick="CE.sections[SE].fields[' + s.fields.indexOf(f) + '].off=false;secEdit(SE)">' + esc(f.l) + ' ↩</button>').join(' ') + '</p>' : ''),
    'تمام', () => sheet('شكل السيستم', cfgList(), 'حفظ', cfgSave));
}
function setType(j, t) { const f = CE.sections[SE].fields[j]; f.t = t; if (t === 'link' && !f.to) f.to = CE.sections.find((x, q) => q !== SE).k; if (t === 'select' && !f.o) f.o = []; secEdit(SE); }
function mvF(j) { if (!j) return; const a = CE.sections[SE].fields; [a[j - 1], a[j]] = [a[j], a[j - 1]]; secEdit(SE); }
function cfgSave() { CE.sections.forEach(s => { s.n = String(s.n || '').trim() || 'قسم'; }); saveRec('meta', 'cfg', CE); closeSheet(); render(); toast('شكل السيستم اتحفظ ✓ وهيظهر على كل الأجهزة'); }

/* ---------- المستخدمين (للمدير) ---------- */
async function usersPage() {
  sheet('المستخدمين', '<div class="empty">بحمّل…</div>');
  let L = []; try { L = await api('/rest/v1/members?select=*&order=created_at.asc') || []; } catch (e) { $('shB').innerHTML = '<div class="empty">' + errAr(e) + '</div>'; return; }
  $('shB').innerHTML = '<div class="list">' + L.map(m => '<div class="it"><div class="ic">' + ico('user') + '</div><div class="tx"><div class="t1">' + esc(m.name) + '</div><div class="t2 en">' + esc(m.username) + '</div></div><span class="pill' + (m.role === 'admin' ? ' g' : '') + '">' + (m.owner ? 'صاحب السيستم' : m.role === 'admin' ? 'مدير' : 'مستخدم') + '</span>' + (m.user_id !== ME.id && !m.owner ? '<button onclick="rmUser(\'' + m.user_id + '\')">' + ico('trash', 18) + '</button>' : '') + '</div>').join('') + '</div>' +
    '<div class="ttl">مستخدم جديد</div><div class="fld"><label>الاسم</label><input id="nu_n"></div><div class="fld"><label>اسم الدخول (إنجليزي)</label><input id="nu_u" class="en" autocapitalize="off" autocorrect="off"></div><div class="fld"><label>كلمة السر</label><input id="nu_p" type="password" autocomplete="new-password"></div>' +
    '<div class="fld"><div class="chips" id="nu_r" data-v="user"><button class="on" data-r="user" onclick="pick(this)">مستخدم</button><button data-r="admin" onclick="pick(this)">مدير</button></div></div><button class="btn" style="width:100%" id="nu_b" onclick="addUser()">إضافة</button>';
}
async function addUser() {
  const n = $('nu_n').value.trim(), u = normU($('nu_u').value), p = $('nu_p').value, role = $('nu_r').dataset.v === 'admin' ? 'admin' : 'user';
  if (!n) return toast('اكتب الاسم'); if (!okU(u)) return toast('اسم الدخول حروف إنجليزي صغيرة وأرقام (3 على الأقل)'); if (p.length < 6) return toast('كلمة السر 6 حروف على الأقل');
  $('nu_b').disabled = true;
  try {
    const j = await api('/auth/v1/signup', { method: 'POST', auth: false, body: { email: u2e(u), password: p, data: { name: n } } });
    const uidv = (j.user && j.user.id) || j.id; if (!uidv) throw new Error('مقدرتش أعمل الحساب');
    await api('/rest/v1/members', { method: 'POST', body: { user_id: uidv, username: u, name: n, role } });
    toast('اتضاف ✓ ابعتله اسم الدخول وكلمة السر'); usersPage();
  } catch (e) { toast(errAr(e)); $('nu_b').disabled = false; }
}
async function rmUser(uidv) { try { await api('/rest/v1/members?user_id=eq.' + uidv, { method: 'DELETE' }); toast('اتشال'); usersPage(); } catch (e) { toast(errAr(e)); } }

/* ---------- الدخول ---------- */
function authUI(mode, msg) {
  $('auth').style.display = 'flex'; $('app').style.display = 'none'; const f = $('aform'); $('amsg').textContent = msg || '';
  if (!mode) { f.style.display = 'none'; return; }
  f.style.display = 'flex';
  if (mode === 'login') { $('alead').textContent = 'سجّل دخولك مرة واحدة بس'; f.innerHTML = '<input id="lu" class="en" placeholder="اسم المستخدم" autocapitalize="off" autocorrect="off"><input id="lp" type="password" placeholder="كلمة السر"><button class="btn" id="lb" onclick="doLogin()">دخول</button>'; $('lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); }; }
  else { $('alead').textContent = 'أول مرة: اعمل حساب المدير'; f.innerHTML = '<input id="sn" placeholder="اسمك"><input id="su" class="en" placeholder="اسم الدخول (إنجليزي)" autocapitalize="off"><input id="sp" type="password" placeholder="كلمة السر"><button class="btn" id="lb" onclick="doSetup()">ابدأ</button>'; }
}
async function doLogin() {
  const u = normU($('lu').value), p = $('lp').value; if (!u || !p) return authUI('login', 'اكتب اسم المستخدم وكلمة السر');
  $('lb').disabled = true;
  try { const j = await api('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email: u2e(u), password: p } }); setSes(j); await enter(true); }
  catch (e) { $('lb').disabled = false; $('amsg').textContent = errAr(e); }
}
async function doSetup() {
  const n = $('sn').value.trim(), u = normU($('su').value), p = $('sp').value;
  if (!n || !okU(u) || p.length < 6) return $('amsg').textContent = 'اكتب اسمك واسم دخول إنجليزي وكلمة سر 6 حروف';
  $('lb').disabled = true;
  try { const j = await api('/auth/v1/signup', { method: 'POST', auth: false, body: { email: u2e(u), password: p, data: { name: n } } }); if (!j.access_token) throw new Error('محتاج تقفل Confirm email في Supabase'); setSes(j);
    const ok = await api('/rest/v1/rpc/claim_admin', { method: 'POST', body: { p_username: u, p_name: n } }); if (ok !== true) throw new Error('فيه مدير متسجل بالفعل'); await enter(true); }
  catch (e) { $('lb').disabled = false; $('amsg').textContent = errAr(e); }
}
function needLogin() { SES = null; try { localStorage.removeItem('og-session'); } catch (e) { /* */ } authUI('login', 'محتاج تسجّل دخول تاني — بياناتك اللي على الجهاز محفوظة'); }
async function loadMe() {
  const L = await api('/rest/v1/members?select=*&user_id=eq.' + SES.user.id) || [], m = L[0];
  if (!m) throw Object.assign(new Error('الحساب ده مش متفعّل — كلّم المدير'), { noMember: true });
  ME = { id: SES.user.id, name: m.name, u: m.username, admin: m.role === 'admin', owner: !!m.owner }; IDB.put('kv', 'me', ME);
}
async function enter(fresh) {
  try { if (fresh || !ME) await loadMe(); }
  catch (e) { if (e.noMember) { needLogin(); $('amsg').textContent = e.message; return; } if (!ME) { authUI('login', errAr(e)); return; } }
  $('auth').style.display = 'none'; $('app').style.display = 'flex'; render(); sync(true);
}

/* ---------- التشغيل ---------- */
async function importOld() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k || k.indexOf('og_outbox_') !== 0) continue;
      const a = JSON.parse(localStorage.getItem(k) || '[]');
      if (Array.isArray(a)) a.forEach(e => { if (!Array.isArray(e) || OUT.has(e[0])) return; const o = e[1]; if (o && o.t === 'del') OUT.set(e[0], { t: 'del' }); else if (o && o.t === 'put' && o.data) OUT.set(e[0], { t: 'put', coll: o.coll, data: o.data, b: o.b || null, u: o.u || '' }); if (OUT.has(e[0])) IDB.put('out', e[0], OUT.get(e[0])); });
      localStorage.removeItem(k); i--;
    }
  } catch (e) { /* */ }
}
(async function boot() {
  try { await IDB.open(); } catch (e) { authUI('', ''); $('alead').textContent = 'التليفون مش مسامح بالتخزين — افتحه من Safari العادي مش الخاص'; return; }
  (await IDB.all('rows')).forEach(([k, v]) => ROWS.set(k, v)); (await IDB.all('out')).forEach(([k, v]) => OUT.set(k, v));
  (await IDB.all('kv')).forEach(([k, v]) => { if (k === 'me') ME = v; if (k === 'last') LAST = v; });
  await importOld();
  try { SES = JSON.parse(localStorage.getItem('og-session') || 'null'); if (!SES) { const o = JSON.parse(localStorage.getItem('og-auth') || 'null'); if (o && o.refresh_token) setSes(o); } } catch (e) { SES = null; }
  if (SES && ME && ME.id === SES.user.id) { enter(false); }
  else if (SES) { if (navigator.onLine) enter(true); else authUI('', 'محتاج نت أول مرة بس عشان يجيب حسابك'); }
  else if (!navigator.onLine) { authUI('', ''); $('alead').textContent = 'أول دخول محتاج نت — وبعد كده يشتغل من غيره'; }
  else { authUI(''); try { const need = await api('/rest/v1/rpc/setup_needed', { method: 'POST', auth: false, body: {} }); authUI(need === true ? 'setup' : 'login'); } catch (e) { authUI('login'); } }
  window.addEventListener('online', () => { syncStatus(); sync(true); });
  window.addEventListener('offline', syncStatus);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
  POLL = setInterval(() => { if (!document.hidden && ME) sync(); }, 8000);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').then(r => { r.update(); }).catch(() => { /* */ });
})();

</script>
