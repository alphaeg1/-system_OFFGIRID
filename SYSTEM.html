<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>OFFGRID</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OFFGRID">
<meta name="theme-color" content="#0b0b0d"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0d;--card:#151519;--card2:#1d1d23;--line:#2a2a32;--tx:#f3f2ef;--mu:#8e8d96;--ac:#2f7bff;--ac2:#8ab4ff;--ok:#36c98a;--bad:#ff5b5b;--warn:#ffb340;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.num{font-variant-numeric:tabular-nums}.en{direction:ltr;unicode-bidi:isolate}
.mu{color:var(--mu)}.sm{font-size:13px}.b{font-weight:700}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* شاشة الدخول */
#auth{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 30px) 24px calc(var(--sb) + 30px);gap:12px;background:radial-gradient(120% 80% at 50% 0%,#14213d 0%,var(--bg) 60%)}
#auth .logo{width:84px;height:84px;border-radius:22px;align-self:center;margin-bottom:6px}
#auth h1{margin:0;text-align:center;font-size:28px;letter-spacing:1px}#auth p{margin:0 0 8px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;font-weight:700;border-radius:14px;padding:14px 18px;font-size:17px}
.btn.g{background:var(--card2);color:var(--tx)}.btn.r{background:rgba(255,91,91,.14);color:var(--bad)}.btn:disabled{opacity:.5}
#amsg{color:var(--bad);text-align:center;min-height:22px;font-size:14px}
/* الهيكل */
#app{display:none;height:100%;flex-direction:column}
header{padding:calc(var(--st) + 10px) 18px 8px;display:flex;align-items:flex-end;gap:10px;background:linear-gradient(var(--bg) 70%,rgba(11,11,13,0));position:sticky;top:0;z-index:5}
header h2{margin:0;font-size:30px;font-weight:800;flex:1;line-height:1.2}
#sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 10px;margin-bottom:6px;white-space:nowrap}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}#sync.off i{background:var(--warn)}#sync.up i{background:var(--ac);animation:pu 1s infinite}#sync.err i{background:var(--bad)}
@keyframes pu{50%{opacity:.3}}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(var(--sb) + 96px)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(21,21,25,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(var(--sb) + 4px);z-index:10}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 0}
nav button.on{color:var(--ac)}
#fab{position:fixed;left:18px;bottom:calc(var(--sb) + 76px);width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(47,123,255,.45);z-index:11}
#fab svg{width:28px;height:28px}
/* مكونات */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px;font-weight:800;font-size:17px}
.ttl button{color:var(--ac);font-weight:600;font-size:15px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big .k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.big .k.w{grid-column:span 2;background:linear-gradient(135deg,#17305f,#0f1b33);border-color:#24427a}
.big .l{font-size:13px;color:var(--mu)}.big .v{font-size:24px;font-weight:800;margin-top:2px}.big .k.w .v{font-size:32px}
.v.ok{color:var(--ok)}.v.bad{color:var(--bad)}
.month{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.month button{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.month b{font-size:17px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}.it:active{background:var(--card2)}
.it .ic{width:38px;height:38px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--ac2);flex:none}
.it .tx{flex:1;min-width:0}.it .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t2{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .amt{font-weight:800;white-space:nowrap}.amt.in{color:var(--ok)}.amt.out{color:var(--bad)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);border-color:var(--ok)}.chk.on:after{content:"";width:10px;height:6px;border:solid #06261a;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.pill{font-size:12px;border-radius:20px;padding:2px 9px;background:var(--card2);color:var(--mu);white-space:nowrap}
.pill.r{background:rgba(255,91,91,.14);color:var(--bad)}.pill.y{background:rgba(255,179,64,.14);color:var(--warn)}.pill.g{background:rgba(54,201,138,.14);color:var(--ok)}
.empty{padding:30px 10px;text-align:center;color:var(--mu)}
.srch{position:relative;margin-bottom:10px}.srch input{padding-right:42px;background:var(--card)}.srch svg{position:absolute;right:13px;top:13px;color:var(--mu)}
.segs{display:flex;gap:6px;margin-bottom:10px;overflow:auto}.segs button{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}.segs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;text-align:center}
.tile .ic{color:var(--ac2)}.tile small{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:8px}
/* الشيت */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:21;display:flex;flex-direction:column;padding-bottom:var(--sb)}
body.sh #shade{opacity:1;pointer-events:auto}body.sh #sheet{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 2px}
#sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px}
#sheet .hd b{font-size:19px}#sheet .hd button{color:var(--ac);font-weight:700;font-size:16px}
#sheet .bd{overflow:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13px;color:var(--mu);margin:0 4px 5px}
.tog{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sw{width:51px;height:31px;border-radius:31px;background:#3a3a42;position:relative;transition:.2s;flex:none}.sw:after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{right:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:8px 13px;border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:14px}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--mu)}.kv b{text-align:left}
.prog{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok);border-radius:8px}
.fe{display:flex;gap:6px;align-items:center;margin-bottom:8px}.fe input{flex:1;padding:10px 12px}.fe select{width:118px;padding:10px 8px}
.fe button{width:34px;height:34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}
#toast{position:fixed;top:calc(var(--st) + 12px);left:50%;transform:translate(-50%,-150%);background:#2b2b33;color:#fff;border-radius:14px;padding:11px 18px;font-size:15px;z-index:40;transition:transform .3s;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{transform:translate(-50%,0)}
#inst{display:none;margin-bottom:12px;background:linear-gradient(135deg,#1c2e55,#141c2e);border:1px solid #2c467c;border-radius:18px;padding:14px 16px;font-size:14.5px}
#inst b{display:block;font-size:16px;margin-bottom:4px}
</style></head><body>

<div id="auth"><img class="logo" src="icon-192.png" alt=""><h1 class="en">OFFGRID</h1><p class="mu" id="alead">بحمّل…</p>
 <div id="aform" style="display:none;flex-direction:column;gap:10px"></div><div id="amsg"></div></div>

<div id="app"><header><h2 id="ht"></h2><div id="sync"><i></i><span id="syt"></span></div></header>
 <main id="main"></main>
 <button id="fab" onclick="quickAdd()" aria-label="إضافة"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
 <nav id="nav"></nav></div>
<div id="shade" onclick="closeSheet()"></div><div id="sheet"><div class="grab"></div><div class="hd"><b id="shT"></b><button id="shA"></button></div><div class="bd" id="shB"></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body></html>
